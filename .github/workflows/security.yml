name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_mysql, zip
          coverage: none
      - name: Validate dependency lock
        run: composer validate --strict --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Check platform requirements
        run: composer check-platform-reqs
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Run database-free unit tests
        run: php vendor/phpunit/phpunit/phpunit --testsuite Unit --display-phpunit-deprecations

      # La integración completa se ejecuta sobre ocobo_back de desarrollo con rollback.
      # Este workflow no crea otra BD, no migra, no usa JWT ni despliega a producción.
